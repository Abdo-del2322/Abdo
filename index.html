<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار أساسيات الكمبيوتر الشامل</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --text-white: #ffffff;
      --success: #238636;
      --error: #da3633;
      --border: #30363d;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    h1 { color: var(--text-white); margin-bottom: 5px; }
    .progress-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: bold;
    }
    .q-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .q-num {
      color: var(--accent);
      font-weight: bold;
      margin-bottom: 10px;
    }
    .q-text {
      color: var(--text-white);
      font-size: 1.1rem;
      margin-bottom: 15px;
      white-space: pre-line;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .option-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      text-align: right;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .option-btn:hover { background: #30363d; }
    .option-btn.correct { background: var(--success) !important; color: white; }
    .option-btn.wrong { background: var(--error) !important; color: white; }
    .explanation {
      margin-top: 15px;
      padding: 10px;
      background: #1c2128;
      border-right: 4px solid var(--accent);
      border-radius: 4px;
      font-size: 0.95rem;
      display: none;
    }
    .text-input-area {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input[type="text"], textarea {
      background: #0d1117;
      border: 1px solid var(--border);
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 1rem;
      width: 100%;
      box-sizing: border-box;
    }
    .submit-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: fit-content;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>اختبار أساسيات الكمبيوتر الشامل</h1>
    <p>اختبار تفاعلي شامل لكافة المفاهيم والنظم العددية</p>
  </header>

  <div class="progress-bar" id="progress">
    التقدم: تم إجابة <span id="answered-count">0</span> من <span id="total-count">0</span>
  </div>

  <div id="questions-container"></div>
</div>

<script>
const QUESTIONS = [

  { type: 'mcq', q: "البيانات التي يدخلها المستخدم إلى الكمبيوتر تسمى:", options: ["أ) Output", "ب) Processing", "ج) Input", "د) Storage"], ans: 2, exp: "الإجابة الصحيحة: Input." },
  { type: 'mcq', q: "العملية التي يقوم فيها الكمبيوتر بمعالجة البيانات وفقًا للتعليمات تسمى:", options: ["أ) Input", "ب) Processing", "ج) Output", "د) Storage"], ans: 1, exp: "الإجابة الصحيحة: Processing." },
  { type: 'mcq', q: "النتائج المفيدة التي يحصل عليها المستخدم تسمى:", options: ["أ) Input", "ب) Data", "ج) Output", "د) Hardware"], ans: 2, exp: "الإجابة الصحيحة: Output." },
  { type: 'mcq', q: "أي مما يلي يعتبر من وحدات الإدخال؟", options: ["أ) الشاشة", "ب) الطابعة", "ج) لوحة المفاتيح", "د) السماعة"], ans: 2, exp: "الإجابة الصحيحة: لوحة المفاتيح." },
  { type: 'mcq', q: "أي مما يلي يعتبر Hardware؟", options: ["أ) Windows", "ب) Google Chrome", "ج) Keyboard", "د) Microsoft Word"], ans: 2, exp: "الإجابة الصحيحة: Keyboard." },
  { type: 'mcq', q: "أي مما يلي يعتبر Software؟", options: ["أ) Mouse", "ب) RAM", "ج) CPU", "د) Windows"], ans: 3, exp: "الإجابة الصحيحة: Windows." },
  { type: 'mcq', q: "عقل الكمبيوتر هو:", options: ["أ) RAM", "ب) CPU", "ج) Hard Disk", "د) Keyboard"], ans: 1, exp: "الإجابة الصحيحة: CPU." },
  { type: 'mcq', q: "الذاكرة المؤقتة التي تخزن البيانات أثناء تشغيل البرامج هي:", options: ["أ) RAM", "ب) Hard Disk", "ج) Monitor", "د) Mouse"], ans: 0, exp: "الإجابة الصحيحة: RAM." },
  { type: 'mcq', q: "الوحدة التي تخزن البيانات حتى بعد إيقاف تشغيل الكمبيوتر هي:", options: ["أ) RAM", "ب) CPU", "ج) Storage", "د) Keyboard"], ans: 2, exp: "الإجابة الصحيحة: Storage." },
  { type: 'mcq', q: "الكمبيوتر يفهم داخليًا لغة مكونة من:", options: ["أ) 0 و1", "ب) 1 و2", "ج) 0 إلى 9", "د) A وB"], ans: 0, exp: "الإجابة الصحيحة: 0 و1." },
  { type: 'mcq', q: "تسمى اللغة التي تعتمد على 0 و1:", options: ["أ) Decimal Language", "ب) Binary Language", "ج) Human Language", "د) Programming Language"], ans: 1, exp: "الإجابة الصحيحة: Binary Language." },
  { type: 'mcq', q: "النظام العشري يستخدم:", options: ["أ) رقمين", "ب) 8 أرقام", "ج) 10 أرقام", "د) 16 رقمًا"], ans: 2, exp: "الإجابة الصحيحة: 10 أرقام." },
  { type: 'mcq', q: "النظام الثنائي هو نظام أساسه:", options: ["أ) 2", "ب) 8", "ج) 10", "د) 16"], ans: 0, exp: "الإجابة الصحيحة: 2." },
  { type: 'mcq', q: "النظام العشري هو نظام أساسه:", options: ["أ) 2", "ب) 5", "ج) 8", "د) 10"], ans: 3, exp: "الإجابة الصحيحة: 10." },
  
  // صح أم خطأ

  { type: 'mcq', q: "الـ Hardware هو الأجزاء التي يمكن رؤيتها ولمسها.", options: ["صح", "خطأ"], ans: 0, exp: "✅ صح." },
  { type: 'mcq', q: "برنامج Microsoft Word يعتبر Hardware.", options: ["صح", "خطأ"], ans: 1, exp: "❌ خطأ. Microsoft Word يعتبر Software." },

  { type: 'mcq', q: "إذا كتبت اسمك باستخدام لوحة المفاتيح، فإن لوحة المفاتيح تعتبر:", options: ["أ) Output", "ب) Input", "ج) Storage", "د) Processing"], ans: 1, exp: "الإجابة الصحيحة: Input." },
  { type: 'mcq', q: "عندما يعالج CPU البيانات، فإن هذا يسمى:", options: ["أ) Storage", "ب) Processing", "ج) Input", "د) Output"], ans: 1, exp: "الإجابة الصحيحة: Processing." },
  { type: 'mcq', q: "أي من التالي يمكن لمسه؟", options: ["أ) Windows", "ب) Google Chrome", "ج) Keyboard", "د) Microsoft Word"], ans: 2, exp: "الإجابة الصحيحة: Keyboard." },
  { type: 'mcq', q: "أي من التالي لا يمكن لمسه كقطعة مادية؟", options: ["أ) Mouse", "ب) Monitor", "ج) RAM", "د) Paint"], ans: 3, exp: "الإجابة الصحيحة: Paint." },
  { type: 'mcq', q: "أي مما يلي يمثل Information وليس Data؟", options: ["أ) 70, 85, 50, 90", "ب) A, B, C", "ج) متوسط درجات الطلاب = 69.3", "د) 52, 8, 13"], ans: 2, exp: "الإجابة الصحيحة: متوسط درجات الطلاب = 69.3." },
  { type: 'mcq', q: "درجات الطلاب قبل ترتيبها وتحليلها تعتبر:", options: ["أ) Information", "ب) Data", "ج) Output Device", "د) Software"], ans: 1, exp: "الإجابة الصحيحة: Data." },
  { type: 'mcq', q: "تقرير يوضح أعلى درجة وأقل درجة ومتوسط درجات الطلاب يعتبر:", options: ["أ) Data", "ب) Raw Data", "ج) Information", "د) Hardware"], ans: 2, exp: "الإجابة الصحيحة: Information." },

  // أسئلة علل وإكمال مقالية
  { type: 'text', q: "أكمل: الكمبيوتر يستقبل البيانات من المستخدم كـ ______ ثم يعالجها ويعطي ______.", ans: ["Input", "Output"], exp: "الإجابة النموذجية: Input — Output." },
  { type: 'text', q: "أكمل: المكونات المادية للكمبيوتر تسمى ______.", ans: ["Hardware"], exp: "الإجابة: Hardware." },

  { type: 'text', q: "أكمل: البيانات الخام التي ليس لها معنى واضح بمفردها تسمى ______.", ans: ["Data"], exp: "الإجابة: Data." },
  { type: 'text', q: "أكمل: البيانات التي تمت معالجتها وتنظيمها وأصبحت ذات معنى تسمى ______.", ans: ["Information"], exp: "الإجابة: Information." },

  { type: 'text', q: "أكمل: النظام الذي يستخدم 0 و1 فقط يسمى النظام ______.", ans: ["الثنائي", "Binary"], exp: "الإجابة: الثنائي Binary." },

  { type: 'text', q: "علل: لماذا لا نقول إن Microsoft Word من الـ Hardware؟", ans: [], exp: "الإجابة: لأنه برنامج وتعليمات لا يمكن لمسها كقطعة مادية، ولذلك فهو Software." },

  { type: 'text', q: "علل: لماذا يعتبر CPU عقل الكمبيوتر؟", ans: [], exp: "الإجابة: لأنه ينفذ التعليمات ويعالج البيانات." },
  { type: 'text', q: "علل: لماذا نحتاج إلى Storage؟", ans: [], exp: "الإجابة: لتخزين البيانات والملفات والنتائج بحيث يمكن استرجاعها لاحقًا حتى بعد إيقاف تشغيل الجهاز." },
  { type: 'text', q: "علل: لماذا تعتبر RAM ذاكرة مؤقتة؟", ans: [], exp: "الإجابة: لأنها تخزن البيانات أثناء تشغيل البرامج، وليست للتخزين الدائم." },

  // ثالثاً: أسئلة فهم وتحويلات
  { type: 'text', q: "قام طالب بكتابة الرقم 90 باستخدام لوحة المفاتيح، ثم قام الكمبيوتر بحساب متوسط درجاته وعرض النتيجة على الشاشة. حدد الـ Input و Processing و Output.", ans: [], exp: "Input: الرقم 90 عبر لوحة المفاتيح.\nProcessing: حساب المتوسط بواسطة CPU.\nOutput: ظهور النتيجة على الشاشة." },

  { type: 'text', q: "قارن بين Hardware و Software.", ans: [], exp: "Hardware: الأجزاء المادية الملموسة مثل Mouse وCPU.\nSoftware: البرامج والتعليمات البرمجية مثل Windows وWord." },
  { type: 'text', q: "طالب قال: 'كل ما يظهر على شاشة الكمبيوتر يعتبر Input لأن المستخدم يراه'. هل كلامه صحيح؟ وضح.", ans: [], exp: "❌ غير صحيح. الشاشة من Output Devices لأنها تعرض النتائج، بينما Input هو البيانات المدخلة للجهاز." },
  { type: 'text', q: "طالب قال: 'RAM و Hard Disk نفس الوظيفة لأن الاثنين يخزنون البيانات'. هل العبارة صحيحة؟", ans: [], exp: "❌ غير صحيحة. RAM ذاكرة مؤقتة أثناء التشغيل فقط، بينما Storage/Hard Disk تخزين دائم." },
  { type: 'text', q: "إذا كان الكمبيوتر لا يفهم الأمر 'Open Camera' باللغة البشرية مباشرة، فما الذي يحدث لهذا الأمر قبل تنفيذه؟", ans: [], exp: "يتم تحويله لتمثيل ثنائي (0 و1)، ثم يعالجه الكمبيوتر وينفذه." },
  { type: 'text', q: "لماذا يمكن للكمبيوتر تخزين الصوت والصور والفيديو والنصوص رغم أنها أشياء مختلفة؟", ans: [], exp: "لأن جميع تلك البيانات يتم تحويلها إلى شكل رقمي وحفظها كأصفار وآحاد (0 و1)." },
  { type: 'text', q: "أيهما يأتي أولًا: Data أم Information؟ ولماذا؟", ans: [], exp: "Data تأتي أولاً لأنها المدخلات الخام التي تتم معالجتها لتصبح Information." },
  { type: 'text', q: "إذا كانت درجات 7 طلاب هي (70, 85, 50, 90, 60, 75, 55)، احسب المتوسط وحدد أعلى وأقل درجة، وهل النتيجة Data أم Information؟", ans: [], exp: "أعلى درجة: 90\nأقل درجة: 50\nالمتوسط: 485 ÷ 7 = 69.3 تقريباً.\nالنتيجة تعتبر Information لأنها ناتجة عن معالجة البيانات الخام." }
];

let answeredSet = new Set();

function renderQuestions() {
  const container = document.getElementById('questions-container');
  document.getElementById('total-count').innerText = QUESTIONS.length;

  QUESTIONS.forEach((q, index) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    
    let html = `<div class="q-num">سؤال ${index + 1}</div>`;
    html += `<div class="q-text">${q.q}</div>`;

    if (q.type === 'mcq') {
      html += `<div class="options">`;
      q.options.forEach((opt, optIdx) => {
        html += `<button class="option-btn" onclick="checkMcq(${index}, ${optIdx}, this)">${opt}</button>`;
      });
      html += `</div>`;
    } else {
      html += `
        <div class="text-input-area">
          <textarea id="input-${index}" rows="2" placeholder="اكتب إجابتك هنا..."></textarea>
          <button class="submit-btn" onclick="checkText(${index})">تحقق من الإجابة</button>
        </div>
      `;
    }

    html += `<div class="explanation" id="exp-${index}">${q.exp.replace(/\n/g, '<br>')}</div>`;
    card.innerHTML = html;
    container.appendChild(card);
  });
}

function updateProgress(idx) {
  answeredSet.add(idx);
  document.getElementById('answered-count').innerText = answeredSet.size;
}

function checkMcq(qIdx, optIdx, btn) {
  const q = QUESTIONS[qIdx];
  const parent = btn.parentElement;
  const buttons = parent.querySelectorAll('.option-btn');
  
  buttons.forEach(b => b.disabled = true);
  
  if (optIdx === q.ans) {
    btn.classList.add('correct');
  } else {
    btn.classList.add('wrong');
    buttons[q.ans].classList.add('correct');
  }

  document.getElementById(`exp-${qIdx}`).style.display = 'block';
  updateProgress(qIdx);
}

function checkText(qIdx) {
  document.getElementById(`exp-${qIdx}`).style.display = 'block';
  updateProgress(qIdx);
}

window.onload = renderQuestions;
</script>
</body>
</html>
